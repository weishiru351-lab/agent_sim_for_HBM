  <text class="node-title" x="325.0" y="119.0" text-anchor="middle">母 Agent</text>
  <text class="node-detail" x="325.0" y="139.0" text-anchor="middle">提出假设 · 选择候选 · 分配预算</text>
  <text class="node-title" x="325.0" y="205.0" text-anchor="middle">统一评价入口</text>
  <text class="node-detail" x="325.0" y="225.0" text-anchor="middle">规范化 · 查询缓存 · 管理预算</text>
  <text class="edge-label" x="365" y="170" text-anchor="middle">候选 DSL</text>
  <text class="edge-label" x="539" y="200" text-anchor="middle">命中缓存或输入非法</text>
  <text class="node-title" x="725.0" y="205.0" text-anchor="middle">复用结果 / 返回错误</text>
  <text class="node-detail" x="725.0" y="225.0" text-anchor="middle">跳过新评价</text>
  <text class="group-title" x="58" y="294" text-anchor="start">正确性验证</text>
  <text class="node-title" x="169.0" y="326.0" text-anchor="middle">验证子 Agent</text>
  <text class="node-detail" x="169.0" y="346.0" text-anchor="middle">组织检查 · 分析反例</text>
  <text class="node-title" x="473.5" y="326.0" text-anchor="middle">验证工具</text>
  <text class="node-detail" x="473.5" y="346.0" text-anchor="middle">内容与状态检查 · 按需 RTL</text>
  <text class="edge-label" x="273" y="263" text-anchor="middle">新候选</text>
  <text class="edge-label" x="317" y="321" text-anchor="middle">调用</text>
  <text class="edge-label" x="445" y="413" text-anchor="middle">验证子 Agent 报告</text>
  <text class="node-title" x="325" y="432" text-anchor="middle">验证通过？</text>
  <text class="edge-label" x="530" y="417" text-anchor="middle">失败</text>
