<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 858" width="920" height="858" role="img" aria-labelledby="title desc">
  <title id="title">目标架构：母 Agent 与两个子 Agent</title>
  <desc id="desc">固定任务从上方进入母 Agent。评价入口先派发验证，验证通过后再派发性能评估。指标、反例与缓存结果汇总为反馈，继续时回到母 Agent，结束时在底部输出结果。</desc>
  <defs>
    <marker id="edge-tip" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#50647b"/>
    </marker>
    <marker id="loop-tip" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#2563a2"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #203247; }
    .node-title { font-size: 16px; font-weight: 650; }
    .node-detail, .edge-label, .feedback-label { font-size: 13px; }
    .node-detail, .edge-label { fill: #42576c; }
    .group-title, .feedback-label { fill: #255582; font-size: 14px; font-weight: 650; }
    .tool { fill: #f1f5f9; stroke: #91a3b7; }
    .agent { fill: #e8f2ff; stroke: #5584b5; }
    .endpoint { fill: #e9f6ef; stroke: #5a927c; }
    .decision { fill: #fff3d9; stroke: #ab813d; }
    .group { fill: #f7faff; stroke: #c6d8ed; }
    .edge, .loop { fill: none; stroke-width: 1.6; stroke-linejoin: round; }
    .edge { stroke: #50647b; }
    .loop { stroke: #2563a2; stroke-dasharray: 6 4; }
  </style>
