  <text class="node-detail" x="725.0" y="442.0" text-anchor="middle">定位对象、地址或状态</text>
  <text class="group-title" x="58" y="520" text-anchor="start">性能评估</text>
  <text class="node-title" x="149.0" y="556.0" text-anchor="middle">性能评估子 Agent</text>
  <text class="node-detail" x="149.0" y="576.0" text-anchor="middle">下发任务 · 解读结果</text>
  <text class="node-title" x="342.0" y="556.0" text-anchor="middle">任务前端</text>
  <text class="node-detail" x="342.0" y="576.0" text-anchor="middle">生成请求与依赖</text>
  <text class="node-title" x="518.0" y="556.0" text-anchor="middle">性能后端</text>
  <text class="node-detail" x="518.0" y="576.0" text-anchor="middle">计时模型或仿真器</text>
  <text class="edge-label" x="227" y="472" text-anchor="middle">通过 · 入口派发性能任务</text>
  <text class="edge-label" x="440" y="614" text-anchor="middle">性能子 Agent 报告</text>
  <text class="node-title" x="325.0" y="656.0" text-anchor="middle">统一入口汇总反馈</text>
  <text class="node-detail" x="325.0" y="676.0" text-anchor="middle">汇总指标、诊断、反例和预算</text>
  <text class="node-title" x="325" y="745" text-anchor="middle">继续探索？</text>
  <text class="feedback-label" x="795" y="730" text-anchor="middle">继续 · 调整候选</text>
  <text class="edge-label" x="399" y="787" text-anchor="middle">结束或预算耗尽</text>
  <text class="node-title" x="325.0" y="823.0" text-anchor="middle">保存最佳已验证候选与评价记录</text>
</svg>
